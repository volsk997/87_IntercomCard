type: custom:bubble-card
card_type: pop-up
hash: '#domofon'
show_header: false
close_by_clicking_outside: true
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Домофон
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: mdi:dialpad
      - type: spacer
      - type: template
        entity: sensor.domofon_sostoianie_linii
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:horizontal-stack-in-card
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity_id: binary_sensor.domofon_vkhodiashchii_zvonok
            state:
              - 'off'
        card:
          type: custom:mushroom-template-card
          entity: button.domofon_propustit
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:sleep
          color: white
          features_position: bottom
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                background: rgba(0,0,0,0.5) !important;
                zoom: 2;
              }
      - type: conditional
        conditions:
          - condition: state
            entity_id: binary_sensor.domofon_vkhodiashchii_zvonok
            state:
              - 'on'
        card:
          type: custom:mushroom-template-card
          entity: button.domofon_propustit
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:check
          color: green
          features_position: bottom
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                background: none !important;
                zoom: 2;
              }
      - type: conditional
        conditions:
          - condition: state
            entity_id: binary_sensor.domofon_vkhodiashchii_zvonok
            state:
              - 'on'
        card:
          type: custom:mushroom-template-card
          entity: button.domofon_otkazat
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:close
          color: red
          features_position: bottom
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                background: none !important;
                zoom: 2;
              }
    card_mod:
      style: |
        ha-card {
          background: none !important;

        }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.domofon_otkryvat_vsegda
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'on')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: toggle
        icon: '{{states[config.entity].attributes.icon}}'
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.domofon_vsegda_sbrasyvat
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'on')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: toggle
        icon: '{{states[config.entity].attributes.icon}}'
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.domofon_otkliuchit_trubku_domofona
        grid_options:
          columns: 12
          rows: auto
        color: white
        tap_action:
          action: toggle
        icon: >-
          {% if is_state('switch.domofon_otkliuchit_trubku_domofona','on')%} 
          ion:volume-mute {% else %} ion:volume-high {% endif %}
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.domofon_otkryvat_na_sleduiushchii_zvonok
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'on')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: toggle
        icon: '{{states[config.entity].attributes.icon}}'
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: fit-content
card_layout: large
slide_to_close_distance: '500'
